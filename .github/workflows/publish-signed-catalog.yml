name: 6-A Publish Signed Catalog Release

# Deployment workflow must be merged to protected main before manual use.
# Production environment 'catalog-production' MUST require human approval.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved catalog version (e.g. 0.1.0)"
        type: string
        required: true
      confirmation:
        description: "Type PUBLISH to acknowledge production publication"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: catalog-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Isolated release qualification ${{ matrix.pass }}
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-release.txt
      - name: Validate draft and all existing negative regressions
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -p 'test_validate_catalog.py' -v
      - name: Qualification tests with isolated ephemeral keys
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_release_distribution.py' -v 2>&1 | tee signed-tests.log
          grep -Eq '^Ran 10 tests in ' signed-tests.log
          grep -Fxq OK signed-tests.log
          ! grep -Eq 'skipped=[1-9]|FAILED|ERROR' signed-tests.log
      - name: Confirm exact draft version can be prepared
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/prepare_release.py --version "$VERSION" --out dist

  publish:
    name: Sign, verify, publish with production approval
    needs: [validate]
    if: github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: catalog-production
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-release.txt
      - name: Check protected exact version and duplicate tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          TAG="catalog-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release already exists"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "tag already exists"; exit 1; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          python scripts/validate_catalog.py
          PROTECTED="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          if [ "$PROTECTED" != "true" ]; then
            echo "ERROR: main is not protected; production publication forbidden"
            exit 1
          fi
          python scripts/prepare_release.py --version "$VERSION" --out prepared
      - name: Read signing material from protected environment
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.CATALOG_ED25519_PRIVATE_PEM }}
          TRUSTED_KEY: ${{ secrets.CATALOG_ED25519_PUBLIC_PEM }}
          APPROVED_FINGERPRINT: ${{ vars.CATALOG_ED25519_TRUST_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          test -n "$TRUSTED_KEY"
          test -n "$APPROVED_FINGERPRINT"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/catalog-private.pem"
          printf '%s\n' "$TRUSTED_KEY" > "$RUNNER_TEMP/catalog-public.pem"
          chmod 600 "$RUNNER_TEMP/catalog-private.pem"
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          private=serialization.load_pem_private_key((Path(os.environ['RUNNER_TEMP'])/'catalog-private.pem').read_bytes(),password=None)
          actual=private.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          configured=serialization.load_pem_public_key((Path(os.environ['RUNNER_TEMP'])/'catalog-public.pem').read_bytes())
          expected=configured.public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          if actual != expected: raise SystemExit('signer and trusted verification key mismatch')
          PY
          python scripts/verify_trust_anchor.py --public-key "$RUNNER_TEMP/catalog-public.pem" --expected-sha256 "$APPROVED_FINGERPRINT"
      - name: Sign and verify the exact release assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python scripts/release_catalog.py --catalog prepared/unity-kb-catalog.json --output signed --key "$RUNNER_TEMP/catalog-private.pem" --channel stable --min-analyzer-version 1.0-RC15
          python -m scripts.verify_published_release --assets signed --public-key "$RUNNER_TEMP/catalog-public.pem" --version "$VERSION" --tag "$RELEASE_TAG" --analyzer-version 1.0-RC15
      - name: Create a draft GitHub Release first
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" signed/unity-kb-catalog.json signed/release-manifest.json signed/release-manifest.json.sig --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dell Unity KB Catalog $RELEASE_TAG" --notes "Signed stable KB Catalog. Verify manifest signature with the trusted Analyzer public key." --draft
      - name: Download draft assets and independently verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          for name in unity-kb-catalog.json release-manifest.json release-manifest.json.sig; do cmp "signed/$name" "downloaded/$name"; done
          python -m scripts.verify_published_release --assets downloaded --public-key "$RUNNER_TEMP/catalog-public.pem" --version "$VERSION" --tag "$RELEASE_TAG" --analyzer-version 1.0-RC15
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == env.RELEASE_TAG) | .tagName' | grep -Fx "$RELEASE_TAG"
          echo "Published signed release $RELEASE_TAG after 3 qualification jobs and post-download verification" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear temporary private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/catalog-private.pem" "$RUNNER_TEMP/catalog-public.pem"
