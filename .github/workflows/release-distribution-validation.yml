name: Validate Signed Catalog Distribution
on:
  push:
    branches: [feature/6-release-distribution]
  pull_request:
    paths:
      - "scripts/release_catalog.py"
      - "scripts/catalog_updater.py"
      - "tests/test_release_distribution.py"
      - "requirements-release.txt"
      - ".github/workflows/release-distribution-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-distribution:
    name: Signed distribution test ${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependency
        run: python -m pip install -r requirements-release.txt
      - name: Run release distribution tests, no skips
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_release_distribution.py' -v 2>&1 | tee test-results.log
          grep -Eq "^Ran 8 tests in " test-results.log
          grep -Fxq "OK" test-results.log
          if grep -Eq "skipped=[1-9]|FAILED|ERROR" test-results.log; then exit 1; fi
      - name: Record scope
        run: |
          echo "Pass ${{ matrix.pass }}: 8/8 signed packaging and local updater tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Does not sign, publish or install a production release." >> "$GITHUB_STEP_SUMMARY"

  all-pass:
    name: Require all three isolated jobs
    needs: [signed-distribution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce success
        env:
          RESULT: ${{ needs.signed-distribution.result }}
        run: test "$RESULT" = "success"
